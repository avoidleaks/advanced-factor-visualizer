<html lang="ka">
<head>
    <meta charset="UTF-8">

    <title>Factor Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #8b5cf6;
            --primary-dark: #7c3aed;
            --primary-light: #ddd6fe;
            --success: #10b981;
            --success-light: #d1fae5;
            --warning: #f59e0b;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.15);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #c026d3 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: var(--text-primary);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header Section */
        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 0.6s ease-out;
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 800;
            color: white;
            margin-bottom: 15px;
            letter-spacing: -1px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
        }

        /* Main Card */
        .main-card {
            background: var(--bg-secondary);
            border-radius: 20px;
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out;
        }

        /* Control Panel */
        .control-panel {
            padding: 40px;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-bottom: 2px solid var(--border-color);
        }

        .control-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
        }

        .form-group {
            flex: 1;
            min-width: 200px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            background: white;
            color: var(--text-primary);
        }

        select:hover, input[type="number"]:hover {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        select:focus, input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 32px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex: 1;
            min-width: 140px;
        }

        #btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: var(--shadow-md);
        }

        #btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        #btn:active {
            transform: translateY(0);
        }

        #clearBtn {
            background: var(--border-color);
            color: var(--text-primary);
        }

        #clearBtn:hover {
            background: #cbd5e1;
        }

        /* Results Section */
        .results-section {
            padding: 40px;
        }

        #resultText {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 30px;
            padding: 20px;
            background: var(--primary-light);
            border-left: 4px solid var(--primary);
            border-radius: 10px;
            min-height: 60px;
            display: flex;
            align-items: center;
            opacity: 0;
            animation: slideInLeft 0.5s ease-out forwards;
        }

        #resultText.error {
            background: var(--danger-light);
            border-left-color: var(--danger);
            color: var(--danger);
        }

        #resultText.hidden {
            display: none;
        }

        /* Grid Container for All Factors & Pairs */
        .grid-container {
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .factors-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .pairs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        /* Factor & Pair Cards */
        .factor-card {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.2rem;
            border: 2px solid var(--border-color);
            background: white;
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            transform: scale(0);
            position: relative;
        }

        .factor-card.prime-factor {
            border-color: var(--success);
            background: var(--success-light);
            color: #065f46;
        }

        .factor-card.prime-factor::after {
            content: '★';
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--success);
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
        }

        .pair-card {
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 15px;
            background: #f8fafc;
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            transform: scale(0);
        }

        .pair-card span.highlight {
            color: var(--primary-dark);
            background: var(--primary-light);
            padding: 4px 10px;
            border-radius: 8px;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0);
            }
            70% {
                transform: scale(1.1);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Stats Footer */
        .stats-footer {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 25px 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            text-align: center;
        }

        .stat-item h3 {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            opacity: 0.9;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .stat-item .value {
            font-size: 1.8rem;
            font-weight: 700;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5rem;
            }

            .control-panel {
                padding: 25px;
            }

            .control-group {
                flex-direction: column;
            }

            .form-group {
                width: 100%;
            }

            .button-group {
                width: 100%;
            }

            button {
                min-width: unset;
                width: 100%;
            }

            .pairs-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }

            .stats-footer {
                padding: 20px;
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            width: 100%;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .empty-state p {
            font-size: 1.1rem;
        }
    </style>
</head>

        stat2: "ആകെ ഘടകങ്ങൾ",
        stat3: "അവിഭാജ്യ ഘടകങ്ങൾ",

    },
    eu: { 
        title: "Faktore Guztien Kalkulagailua", 
        subtitle: "Aurkitu edozein zenbakiren zatitzaile eta faktore-bikote guztiak",

        btn: "Kalkulatu",

        res: "Faktore Guztiak",

let currentLang = 'en';

function changeLanguage() {
    currentLang = document.getElementById('langSelect').value;
    updateLanguageUI();
    calculate();
}

function updateLanguageUI() {
    const langData = translations[currentLang];
    document.getElementById('title').innerText = langData.title;
    document.getElementById('subtitle').innerText = langData.subtitle;
    document.getElementById('numInput').placeholder = langData.placeholder;
    document.getElementById('btn').innerText = langData.btn;
    document.getElementById('clearBtn').innerText = langData.clear;
    document.getElementById('emptyMsg').innerText = langData.emptyMsg;
    document.getElementById('stat1-label').innerText = langData.stat1;
    document.getElementById('stat2-label').innerText = langData.stat2;
    document.getElementById('stat3-label').innerText = langData.stat3;
    document.getElementById('stat4-label').innerText = langData.stat4;
    
    if (document.getElementById('langLabel')) {
        document.getElementById('langLabel').innerText = langData.language;
    }
    if (document.getElementById('inputLabel')) {
        document.getElementById('inputLabel').innerText = langData.inputLabel;
    }
}

function isPrime(n) {
    if (n < 2) return false;
    for (let i = 2; i <= Math.sqrt(n); i++) {
        if (n % i === 0) return false;
    }
    return true;
}

function getAllFactors(n) {
    const factors = [];
    for (let i = 1; i <= Math.sqrt(n); i++) {
        if (n % i === 0) {
            factors.push(i);
            if (i !== n / i) {
                factors.push(n / i);
            }
        }
    }
    return factors.sort((a, b) => a - b);
}

function getFactorPairs(n) {
    const pairs = [];
    for (let i = 1; i <= Math.sqrt(n); i++) {
        if (n % i === 0) {
            pairs.push([i, n / i]);
        }
    }
    return pairs;
}

function calculate() {
    const num = parseInt(document.getElementById('numInput').value);
    const langData = translations[currentLang];
    const resultDiv = document.getElementById('resultText');
    const displayContainer = document.getElementById('displayContainer');

    if (isNaN(num) || num <= 0) {
        resultDiv.innerText = langData.invalid;
        resultDiv.classList.add('error');
        resultDiv.classList.remove('hidden');
        displayContainer.innerHTML = `<div class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <p>${langData.emptyMsg}</p>
        </div>`;
        clearStats();
        return;
    }

    resultDiv.classList.remove('error');
    const allFactors = getAllFactors(num);
    const pairs = getFactorPairs(num);
    const primeFactors = allFactors.filter(f => isPrime(f));
    const factorSum = allFactors.reduce((a, b) => a + b, 0);

    resultDiv.innerText = `${langData.res}: ${allFactors.join(", ")}`;
    resultDiv.classList.remove('hidden');

    // Build factor cards HTML
    let factorsHTML = `<div class="grid-container">
        <div>
            <div class="section-title">📌 ${langData.allFactorsTitle}</div>
            <div class="factors-grid">`;
    
    allFactors.forEach((factor, idx) => {
        const isP = isPrime(factor);
        const cardClass = isP ? "factor-card prime-factor" : "factor-card";
        const delay = (idx * 0.05).toFixed(2);
        factorsHTML += `<div class="${cardClass}" style="animation-delay: ${delay}s">${factor}</div>`;
    });

    factorsHTML += `</div></div><div>
            <div class="section-title">🔗 ${langData.pairsTitle}</div>
            <div class="pairs-grid">`;

    pairs.forEach((pair, idx) => {
        const delay = ((allFactors.length * 0.05) + (idx * 0.05)).toFixed(2);
        factorsHTML += `<div class="pair-card" style="animation-delay: ${delay}s">
            <span class="highlight">${pair[0]}</span> × <span class="highlight">${pair[1]}</span>
        </div>`;
    });

    factorsHTML += `</div></div></div>`;

    displayContainer.innerHTML = factorsHTML;

    // Update stats
    document.getElementById('stat1').innerText = num;
    document.getElementById('stat2').innerText = allFactors.length;
    document.getElementById('stat3').innerText = primeFactors.length;
    document.getElementById('stat4').innerText = factorSum;
}

function clearCalculation() {
    document.getElementById('numInput').value = '';
    document.getElementById('resultText').classList.add('hidden');
    document.getElementById('displayContainer').innerHTML = `<div class="empty-state">
        <div class="empty-state-icon">🔢</div>
        <p>${translations[currentLang].emptyMsg}</p>
    </div>`;
    clearStats();
}

function clearStats() {
    document.getElementById('stat1').innerText = '—';
    document.getElementById('stat2').innerText = '—';
    document.getElementById('stat3').innerText = '—';
    document.getElementById('stat4').innerText = '—';
}

// Initialize on page load
updateLanguageUI();
</script>
